<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152d42"><meta name="description" content="동굴바리와 함께 방울로 동굴을 구하는 귀여운 1인용 플랫폼 게임. PC와 모바일에서 바로 플레이하세요.">
<title>동굴바리의 방울 대모험</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="game-shell">
<header><div><span class="eyebrow">작은 동굴, 커다란 모험</span><h1>동굴바리의 <em>방울 대모험</em></h1></div><span class="badge">1 PLAYER · 5 STAGES</span></header>
<section class="dashboard" aria-label="게임 현황"><div>동굴 <strong id="stage">1 / 5</strong></div><div>생명 <strong id="lives">♥ ♥ ♥</strong></div><div>점수 <strong id="score">0</strong></div><div>남은 적 <strong id="remaining">0</strong></div><div>최고 <strong id="best">0</strong></div></section>
<div class="viewport"><canvas id="game" width="800" height="480" tabindex="0" aria-label="동굴바리 게임 화면. 방향키 또는 A D 이동, 스페이스 점프, Z 또는 J 방울 발사"></canvas>
<div id="overlay" class="overlay"><div class="modal"><canvas id="hero-portrait" width="104" height="80" aria-label="새싹 머리와 분홍 볼을 가진 동굴바리"></canvas><span id="modal-tag" class="eyebrow">반짝이는 동굴로 출발!</span><h2 id="modal-title">작지만 용감한<br>동굴바리</h2><p id="modal-description">방울로 말썽꾸러기를 가두고,<br>다가가 톡! 터뜨려 주세요.</p><button id="primary" class="primary">모험 시작</button><p class="tip">갇힌 적은 6초 뒤 탈출해요!</p></div></div></div>
<nav class="toolbar" aria-label="게임 설정"><button id="pause" disabled>Ⅱ 일시정지</button><button id="restart">↻ 다시 시작</button><button id="mute" aria-pressed="false">♪ 소리 켜짐</button></nav>
<div class="touch-controls" aria-label="터치 게임 조작"><div class="move-group"><button data-action="left" aria-label="왼쪽 이동">◀</button><button data-action="right" aria-label="오른쪽 이동">▶</button></div><div class="action-group"><button data-action="jump" class="jump">점프<span>↑</span></button><button data-action="fire" class="fire">방울<span>◉</span></button></div></div>
<footer><p><b>이동</b> ← → / A D <b>점프</b> SPACE <b>방울</b> Z / J <b>쉼</b> ESC</p><p>방울에 가둔 뒤 몸으로 톡! · 빈 방울은 안전해요</p></footer>
</main><script src="./game.js"></script>
</body></html>
